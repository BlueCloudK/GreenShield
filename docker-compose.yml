services:
  greenshield-mvp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenshield-mvp
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      APP_ORIGIN: http://127.0.0.1:8080
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-greenshield-local-docker-key}
    volumes:
      - greenshield-data:/app/data
    restart: unless-stopped

volumes:
  greenshield-data:
