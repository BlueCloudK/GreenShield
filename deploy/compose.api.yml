services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /opt/greenshield/runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      APP_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
